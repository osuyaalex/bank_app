<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BankAL</title>
<style>
  :root { --ink:#1C1939; --muted:#5b5875; --brand:#2E5BFF; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#eceaf5; --muted:#a5a2b8; --bg:#15141f; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); display:grid;
         place-items:center; min-height:100vh; padding:24px;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:420px; text-align:center; }
  h1 { font-size:26px; margin:0 0 8px; letter-spacing:-0.02em; }
  p { color:var(--muted); margin:0 0 22px; }
  a { color:var(--brand); font-weight:600; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>BankAL</h1>
  <p>Reads the bank alerts your phone already receives, and shows you where your
  money goes.</p>
  <p><a href="./policy/">Privacy policy</a></p>
</main>
</body>
</html>
