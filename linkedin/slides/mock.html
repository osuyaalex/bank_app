<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:704px;height:1524px;font-family:Inter,sans-serif;background:#FAFAFA;color:#1A1A1A}
.wrap{padding:56px 40px 0}
.status{display:flex;justify-content:space-between;font-size:26px;font-weight:600;padding:0 12px 34px;color:#333}
h2{font-size:44px;font-weight:700;letter-spacing:-.02em}
.month{margin-top:10px;font-size:28px;color:#8A8A8A}
.total{margin-top:38px;background:#fff;border-radius:28px;padding:36px 32px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.total .l{font-size:26px;color:#8A8A8A}
.total .v{font-size:62px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.row{display:flex;align-items:center;gap:22px;background:#fff;border-radius:24px;padding:26px 28px;margin-top:22px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.ico{width:70px;height:70px;border-radius:20px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:34px}
.nm{font-size:31px;font-weight:600}
.sb{font-size:24px;color:#9A9A9A;margin-top:6px}
.am{margin-left:auto;font-size:32px;font-weight:700}
.ph{position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(transparent,#FAFAFA 60%)}
</style>
<div class="wrap">
  <div class="status"><span>9:41</span><span>▮▮▮ ▮</span></div>
  <h2>Your spending</h2>
  <div class="month">January 2025</div>

  <div class="row"><div class="ico">🍽</div><div><div class="nm">Food</div><div class="sb">12 payments</div></div><div class="am">₦61,200</div></div>
  <div class="row"><div class="ico">⛽</div><div><div class="nm">Car Fuel</div><div class="sb">4 payments</div></div><div class="am">₦48,000</div></div>
  <div class="row"><div class="ico">🚌</div><div><div class="nm">Public Transport</div><div class="sb">9 payments</div></div><div class="am">₦27,500</div></div>
  <div class="row"><div class="ico">📱</div><div><div class="nm">Mobile Phone</div><div class="sb">3 payments</div></div><div class="am">₦18,000</div></div>
  <div class="row"><div class="ico">🛒</div><div><div class="nm">Groceries</div><div class="sb">6 payments</div></div><div class="am">₦16,400</div></div>
</div>
